<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="login.title">Anmelden · racingkalender.de</title>
<link rel="icon" href="data:,">
<script src="/static/i18n.js"></script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
<div class="lang login-lang" data-lang-switch></div>
<main class="login-card">
  <h1>racingkalender.de</h1>
  <p class="muted small" id="login-join" data-i18n="login.join_hint" hidden></p>
  <p class="ok" id="login-info" hidden></p>

  <!-- Anmelden -->
  <form id="f-login" data-mode="login" autocomplete="on">
    <label><span data-i18n="login.user_or_mail"></span>
      <input name="username" autocomplete="username" required autofocus>
    </label>
    <label><span data-i18n="login.password"></span>
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <p class="error" hidden></p>
    <button type="submit" class="btn primary" data-i18n="btn.login"></button>
    <p class="login-links small">
      <a href="#forgot" data-go="forgot" data-needs="reset" data-i18n="login.forgot_link" hidden></a>
      <a href="#register" data-go="register" data-needs="registration" data-i18n="login.register_link" hidden></a>
    </p>
  </form>

  <!-- Registrieren -->
  <form id="f-register" data-mode="register" hidden>
    <h2 data-i18n="login.register"></h2>
    <label><span data-i18n="login.username"></span>
      <input name="username" autocomplete="username" maxlength="64" pattern="[A-Za-z0-9._\-]{2,64}"
             data-i18n-attr="title:login.username_rule" required>
    </label>
    <label><span data-i18n="login.email"></span>
      <input name="email" type="email" autocomplete="email" maxlength="254" required>
    </label>
    <label><span data-i18n="login.pw_min"></span>
      <input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="256" required>
    </label>
    <label><span data-i18n="login.pw_repeat"></span>
      <input name="password2" type="password" autocomplete="new-password" minlength="8" maxlength="256" required>
    </label>
    <p class="muted small" data-i18n="login.register_hint"></p>
    <p class="error" hidden></p>
    <button type="submit" class="btn primary" data-i18n="login.create"></button>
    <p class="login-links small"><a href="#" data-go="login" data-i18n="login.back"></a></p>
  </form>

  <!-- Passwort vergessen -->
  <form id="f-forgot" data-mode="forgot" hidden>
    <h2 data-i18n="login.forgot"></h2>
    <label><span data-i18n="login.user_or_mail"></span>
      <input name="login" autocomplete="username" maxlength="254" required>
    </label>
    <p class="muted small" data-i18n="login.forgot_hint"></p>
    <p class="error" hidden></p>
    <button type="submit" class="btn primary" data-i18n="login.request"></button>
    <p class="login-links small"><a href="#" data-go="login" data-i18n="login.back"></a></p>
  </form>

  <!-- Neues Passwort (aus Mail-Link) -->
  <form id="f-reset" data-mode="reset" hidden>
    <h2 data-i18n="login.new_pw"></h2>
    <label><span data-i18n="login.new_pw_min"></span>
      <input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="256" required>
    </label>
    <label><span data-i18n="login.repeat"></span>
      <input name="password2" type="password" autocomplete="new-password" minlength="8" maxlength="256" required>
    </label>
    <p class="error" hidden></p>
    <button type="submit" class="btn primary" data-i18n="login.save_login"></button>
  </form>

  <!-- Bestätigung (aus Mail-Link) -->
  <div id="f-confirm" data-mode="confirm" hidden>
    <h2 data-i18n="login.confirm"></h2>
    <p class="muted" id="confirm-text"></p>
    <p class="error" hidden></p>
    <p class="login-links small"><a href="#" data-go="login" data-i18n="login.to_login"></a></p>
  </div>
</main>
<p class="legal-links-foot"><a href="/" data-i18n="login.no_account"></a> · <a href="/static/impressum.html" data-i18n="foot.imprint"></a> · <a href="/static/datenschutz.html" data-i18n="foot.privacy"></a></p>
<script src="/static/login.js"></script>
</body>
</html>
