<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161614" media="(prefers-color-scheme: dark)">
<title>racingkalender.de</title>
<link rel="icon" href="data:,">
<script src="/static/i18n.js"></script>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/mobile.css">
</head>
<body class="m">
<header class="m-top">
  <button class="m-icon" id="m-back" data-i18n-attr="aria-label:m.back" hidden>‹</button>
  <h1 id="m-title">racingkalender.de</h1>
  <div class="lang" data-lang-switch></div>
  <button class="m-icon" id="m-menu-btn" data-i18n-attr="aria-label:m.menu">☰</button>
</header>

<main class="m-main">
  <section class="intro m-intro" id="intro" hidden>
    <button type="button" class="intro-thumb" id="intro-thumb" data-i18n-attr="aria-label:intro.play_aria"><span>▶</span></button>
    <div class="intro-text">
      <strong data-i18n="intro.head_m"></strong>
      <span class="muted" data-i18n="intro.text_m"></span>
      <button type="button" class="btn primary" id="intro-play" data-i18n="intro.watch"></button>
    </div>
    <button type="button" class="btn icon" id="intro-close" data-i18n-attr="aria-label:intro.hide">✕</button>
  </section>
  <div class="guest-bar" id="guest-bar" hidden></div>
  <div class="m-legend">
    <div class="cats" id="m-cats"></div>
    <span class="status-legend" data-i18n-attr="aria-label:status.legend_aria"><b data-i18n="status.legend"></b><span class="ev-sample" data-i18n="status.offen"></span><span class="ev-sample geplant" data-i18n="status.geplant"></span><span class="ev-sample gebucht" data-i18n="status.gebucht"></span></span>
    <div class="rf" id="m-rf"></div>
  </div>

  <!-- Jahresübersicht -->
  <section id="m-year">
    <div class="m-months" id="m-months"></div>
  </section>

  <!-- Monat -->
  <section id="m-month" hidden>
    <nav class="m-monthnav">
      <button class="m-icon" id="m-prev" data-i18n-attr="aria-label:m.prev_month">‹</button>
      <h2 id="m-month-title"></h2>
      <button class="m-icon" id="m-next" data-i18n-attr="aria-label:m.next_month">›</button>
    </nav>
    <div class="m-grid" id="m-grid"></div>
    <h3 class="m-listhead" id="m-listhead"></h3>
    <div class="m-list" id="m-list"></div>
  </section>
</main>

<button class="m-fab" id="m-add" data-i18n-attr="aria-label:m.add">+</button>

<!-- Menü -->
<dialog class="sheet" id="m-menu">
  <div class="sheet-body">
    <p class="muted" id="m-user"></p>
    <button class="m-row" id="m-intro-btn" data-i18n="intro.menu" hidden></button>
    <button class="m-row" id="m-groups-btn"><span data-i18n="groups.title"></span> <span class="muted" id="m-groups-count"></span></button>
    <label class="m-row" id="m-only-mine-row"><span data-i18n="m.only_mine"></span><input type="checkbox" id="m-only-mine"></label>
    <a class="m-row" id="m-admin" href="/admin" data-i18n="top.admin" hidden></a>
    <button class="m-row" id="m-feed" data-i18n="feed.title"></button>
    <button class="m-row" id="m-password" data-i18n="pw.title"></button>
    <a class="m-row" href="/?ansicht=desktop" data-i18n="m.desktop"></a>
    <button class="m-row" id="m-logout" data-i18n="btn.logout"></button>
    <a class="m-row" id="m-login" href="/login" data-i18n="btn.login" hidden></a>
    <a class="m-row" id="m-register" href="/login#register" data-i18n="btn.register" hidden></a>
    <p class="m-legal small"><a href="/static/impressum.html" data-i18n="foot.imprint"></a> · <a href="/static/datenschutz.html" data-i18n="foot.privacy"></a></p>
    <button class="btn m-close" data-close data-i18n="btn.close"></button>
  </div>
</dialog>

<!-- Erklär-Video -->
<dialog class="video-dialog m-video" id="video-dialog">
  <div class="video-wrap">
    <video id="video-player" controls playsinline preload="none"></video>
    <button type="button" class="btn icon video-close" data-close data-i18n-attr="aria-label:btn.close">✕</button>
  </div>
</dialog>
<!-- Gruppen -->
<dialog class="sheet" id="m-groups">
  <div class="sheet-body">
    <h2 data-i18n="groups.title"></h2>
    <p class="muted small" data-i18n="groups.intro"></p>
    <div class="gp m-gp" id="m-groups-panel"></div>
    <button class="btn m-close" data-close data-i18n="btn.close"></button>
  </div>
</dialog>

<!-- Event-Details -->
<dialog class="sheet" id="m-detail">
  <div class="sheet-body">
    <span class="cat-badge" id="d-cat"></span>
    <h2 id="d-title"></h2>
    <p class="muted" id="d-dates"></p>
    <p class="refs" id="d-refs" hidden></p>
    <div class="gpart" id="d-groups" hidden></div>
    <p class="note" id="d-note"></p>
    <div id="d-guest" hidden></div>
    <div class="m-status" id="d-status"></div>
    <div id="d-people"></div>
    <p class="muted small" id="d-creator"></p>
    <div class="m-actions" id="d-actions" hidden>
      <button class="btn" id="d-edit" data-i18n="btn.edit"></button>
      <button class="btn danger" id="d-delete" data-i18n="btn.delete"></button>
    </div>
    <button class="btn m-close" data-close data-i18n="btn.close"></button>
  </div>
</dialog>

<!-- Anlegen / Bearbeiten -->
<dialog class="sheet" id="m-edit">
  <form class="sheet-body" id="e-form">
    <h2 id="e-heading"></h2>
    <label><span data-i18n="ev.f.title"></span> <input name="title" maxlength="120" required></label>
    <div class="m-two">
      <label><span data-i18n="ev.f.from"></span> <input name="start_date" type="date" required></label>
      <label><span data-i18n="ev.f.to"></span> <input name="end_date" type="date" required></label>
    </div>
    <label><span data-i18n="ev.f.organizer"></span> <select name="organizer_id"></select></label>
    <label><span data-i18n="ev.f.track"></span> <select name="track_id"></select></label>
    <label><span data-i18n="ev.f.visibility"></span> <select name="visibility" class="vis-select"></select></label>
    <label><span data-i18n="ev.f.note"></span> <textarea name="note" rows="3" maxlength="2000"></textarea></label>
    <p class="error" id="e-error" hidden></p>
    <button type="submit" class="btn primary" data-i18n="btn.save"></button>
    <button type="button" class="btn m-close" data-close data-i18n="btn.cancel"></button>
  </form>
</dialog>

<!-- Passwort ändern -->
<dialog class="sheet" id="m-pw">
  <form class="sheet-body">
    <h2 data-i18n="pw.title"></h2>
    <div class="pw-fields" data-fields>
      <label><span data-i18n="pw.old"></span> <input name="old_password" type="password" autocomplete="current-password" required></label>
      <label><span data-i18n="pw.new"></span> <input name="new_password" type="password" minlength="8" maxlength="256" autocomplete="new-password" required></label>
      <label><span data-i18n="pw.new2"></span> <input name="new_password2" type="password" minlength="8" maxlength="256" autocomplete="new-password" required></label>
    </div>
    <p class="ok" data-ok data-i18n="pw.ok" hidden></p>
    <p class="error" hidden></p>
    <button type="submit" class="btn primary" data-i18n="btn.save"></button>
    <button type="button" class="btn m-close" data-close data-i18n="btn.close"></button>
  </form>
</dialog>

<script src="/static/common.js"></script>
<script src="/static/mobile.js"></script>
</body>
</html>
